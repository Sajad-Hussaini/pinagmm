[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinagmm"
version = "0.9.1"
authors = [{name = "Sajad Hussaini", email = "hussaini.smsajad@gmail.com"}]
description = "A Physics-Informed Neural Additive Ground Motion Model for Hazard-Compatible Three-Component Stochastic Simulation."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
keywords = [
    "ground motion models",
    "stochastic ground motion simulation",
    "conditional simulation",
    "neural networks",
    "earthquake simulation",
    "mixed-effects model",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn==1.8.0",
    "torch",
    "mmer==1.4.5",
    "sgsim==1.6.3",
    "matplotlib",
    "dash==4.4.1",
    "dash-bootstrap-components==2.0.4",
    "plotly==6.9.0",
]

[project.urls]
Homepage   = "https://github.com/Sajad-Hussaini/PINAGMM"
Repository = "https://github.com/Sajad-Hussaini/PINAGMM"
Issues     = "https://github.com/Sajad-Hussaini/PINAGMM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pinagmm.model" = ["*.joblib"]
"pinagmm.gui" = ["assets/*", "assets/**/*"]

[project.scripts]
pinagmm = "pinagmm.gui.app:run_app"